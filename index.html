<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面試追蹤系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            color: #666;
            font-weight: 500;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-section input,
        .search-section select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            flex: 1;
            min-width: 200px;
        }

        .search-section button {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .search-section button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            grid-column: 1 / -1;
            resize: vertical;
            min-height: 80px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1em;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        .btn-edit {
            background: #4ecdc4;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-edit:hover {
            background: #45b9ae;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85em;
            text-align: center;
            min-width: 80px;
        }

        .status-preparing {
            background: #fff3cd;
            color: #856404;
        }

        .status-applied {
            background: #cfe2ff;
            color: #084298;
        }

        .status-interviewing {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-waiting {
            background: #d3d8de;
            color: #383d41;
        }

        .status-success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-rejected {
            background: #f8d7da;
            color: #842029;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            opacity: 0.9;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #198754;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .close-modal {
            float: right;
            font-size: 1.5em;
            cursor: pointer;
            color: #999;
            border: none;
            background: none;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            color: #333;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.8em;
            }

            th, td {
                padding: 8px;
            }

            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
    <!-- 配置檔案（從 config.js 引入） -->
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 面試追蹤系統</h1>
            <p>記錄、追蹤和分析你的面試進度</p>
        </header>

        <div class="main-content">
            <!-- 標籤頁 -->
            <div class="tabs">
                <button class="tab-button active" data-tab="dashboard">📊 儀表板</button>
                <button class="tab-button" data-tab="add">➕ 新增公司</button>
                <button class="tab-button" data-tab="list">📝 所有記錄</button>
            </div>

            <!-- 儀表板標籤 -->
            <div id="dashboard" class="tab-content active">
                <div class="stats" id="stats"></div>
            </div>

            <!-- 新增公司標籤 -->
            <div id="add" class="tab-content">
                <div class="form-section">
                    <h2>新增面試公司記錄</h2>
                    <form id="addForm" style="margin-top: 20px;">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>公司名稱 *</label>
                                <input type="text" name="company_name" required>
                            </div>
                            <div class="form-group">
                                <label>職位名稱 *</label>
                                <input type="text" name="job_title" required>
                            </div>
                            <div class="form-group">
                                <label>地址</label>
                                <input type="text" name="address">
                            </div>
                            <div class="form-group">
                                <label>招聘來源</label>
                                <input type="text" name="source" placeholder="例：104、LinkedIn、公司官網">
                            </div>
                            <div class="form-group">
                                <label>上班時間</label>
                                <input type="text" name="work_time" placeholder="例：08:30~17:30">
                            </div>
                            <div class="form-group">
                                <label>休假制度</label>
                                <input type="text" name="holiday" placeholder="例：週休二日">
                            </div>
                            <div class="form-group">
                                <label>薪水</label>
                                <input type="text" name="salary" placeholder="例：月薪30,000~40,000元">
                            </div>
                            <div class="form-group">
                                <label>工作內容</label>
                                <textarea name="job_description" placeholder="簡述工作內容..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>面試日期</label>
                                <input type="date" name="interview_date">
                            </div>
                            <div class="form-group">
                                <label>面試輪數</label>
                                <select name="interview_round">
                                    <option value="">未選擇</option>
                                    <option value="1st">1st</option>
                                    <option value="2nd">2nd</option>
                                    <option value="Final">Final</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>面試類型</label>
                                <select name="interview_type">
                                    <option value="">未選擇</option>
                                    <option value="電話">電話</option>
                                    <option value="視訊">視訊</option>
                                    <option value="現場">現場</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>面試評價</label>
                                <textarea name="interview_review" placeholder="例：問題深度、溝通順暢等..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>面試結果</label>
                                <select name="interview_result">
                                    <option value="">未選擇</option>
                                    <option value="Pass">Pass</option>
                                    <option value="Fail">Fail</option>
                                    <option value="等待中">等待中</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>目前狀態</label>
                                <select name="status">
                                    <option value="">未選擇</option>
                                    <option value="準備中">準備中</option>
                                    <option value="已投遞">已投遞</option>
                                    <option value="面試中">面試中</option>
                                    <option value="待回覆">待回覆</option>
                                    <option value="錄取">錄取</option>
                                    <option value="婉拒">婉拒</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>回覆日期</label>
                                <input type="date" name="reply_date">
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label>備註</label>
                                <textarea name="notes" placeholder="其他備忘錄..."></textarea>
                            </div>
                        </div>
                        <div class="form-buttons">
                            <button type="button" class="btn btn-secondary" onclick="resetForm()">清空</button>
                            <button type="submit" class="btn btn-primary">新增記錄</button>
                        </div>
                    </form>
                    <div id="formMessage"></div>
                </div>
            </div>

            <!-- 所有記錄標籤 -->
            <div id="list" class="tab-content">
                <div class="search-section">
                    <input type="text" id="searchInput" placeholder="搜尋公司名稱或職位...">
                    <select id="statusFilter">
                        <option value="">所有狀態</option>
                        <option value="準備中">準備中</option>
                        <option value="已投遞">已投遞</option>
                        <option value="面試中">面試中</option>
                        <option value="待回覆">待回覆</option>
                        <option value="錄取">錄取</option>
                        <option value="婉拒">婉拒</option>
                    </select>
                    <button onclick="applyFilters()">搜尋</button>
                    <button onclick="downloadCSV()" class="btn-secondary" style="background: #28a745; color: white; border: none;">📥 下載 CSV</button>
                </div>
                <div id="tableContainer" class="table-responsive">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 編輯模態框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div class="modal-header">編輯記錄</div>
            <form id="editForm">
                <input type="hidden" name="rowIndex">
                <div class="form-grid">
                    <div class="form-group">
                        <label>公司名稱</label>
                        <input type="text" name="company_name" required>
                    </div>
                    <div class="form-group">
                        <label>職位名稱</label>
                        <input type="text" name="job_title" required>
                    </div>
                    <div class="form-group">
                        <label>地址</label>
                        <input type="text" name="address">
                    </div>
                    <div class="form-group">
                        <label>招聘來源</label>
                        <input type="text" name="source">
                    </div>
                    <div class="form-group">
                        <label>上班時間</label>
                        <input type="text" name="work_time">
                    </div>
                    <div class="form-group">
                        <label>休假制度</label>
                        <input type="text" name="holiday">
                    </div>
                    <div class="form-group">
                        <label>薪水</label>
                        <input type="text" name="salary">
                    </div>
                    <div class="form-group">
                        <label>工作內容</label>
                        <textarea name="job_description"></textarea>
                    </div>
                    <div class="form-group">
                        <label>面試日期</label>
                        <input type="date" name="interview_date">
                    </div>
                    <div class="form-group">
                        <label>面試輪數</label>
                        <select name="interview_round">
                            <option value="">未選擇</option>
                            <option value="1st">1st</option>
                            <option value="2nd">2nd</option>
                            <option value="Final">Final</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>面試類型</label>
                        <select name="interview_type">
                            <option value="">未選擇</option>
                            <option value="電話">電話</option>
                            <option value="視訊">視訊</option>
                            <option value="現場">現場</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>面試評價</label>
                        <textarea name="interview_review"></textarea>
                    </div>
                    <div class="form-group">
                        <label>面試結果</label>
                        <select name="interview_result">
                            <option value="">未選擇</option>
                            <option value="Pass">Pass</option>
                            <option value="Fail">Fail</option>
                            <option value="等待中">等待中</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>目前狀態</label>
                        <select name="status">
                            <option value="">未選擇</option>
                            <option value="準備中">準備中</option>
                            <option value="已投遞">已投遞</option>
                            <option value="面試中">面試中</option>
                            <option value="待回覆">待回覆</option>
                            <option value="錄取">錄取</option>
                            <option value="婉拒">婉拒</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>回覆日期</label>
                        <input type="date" name="reply_date">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>備註</label>
                        <textarea name="notes"></textarea>
                    </div>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 配置會從 config.js 引入（見下方）
        // 如果 CONFIG 未定義，使用默認值（提示用戶配置）
        if (typeof CONFIG === 'undefined') {
            var CONFIG = {
                APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzM_j_cxfxXqAbi9yZD0mRzjTr0tbArWZX9tUtEhgWX/dev',
                SHEETS_API_KEY: 'YOUR_SHEETS_API_KEY',
                SHEET_ID: 'YOUR_SHEET_ID'
            };
        }

        let allData = [];
        let currentEditIndex = -1;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            setupTabs();
            setupFormSubmit();
            loadDataFromGoogleSheet();
            updateStats();
        });

        // 標籤頁切換
        function setupTabs() {
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', () => {
                    const tabName = button.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(tab => {
                        tab.classList.remove('active');
                    });
                    document.querySelectorAll('.tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    document.getElementById(tabName).classList.add('active');
                    button.classList.add('active');

                    if (tabName === 'list') {
                        displayTable(allData);
                    }
                });
            });
        }

        // 從 Google Sheet 讀取數據
        async function loadDataFromGoogleSheet() {
            try {
                const sheetId = CONFIG.SHEET_ID || getEnvironmentVariable('SHEET_ID');
                const apiKey = CONFIG.SHEETS_API_KEY || getEnvironmentVariable('SHEETS_API_KEY');

                if (!sheetId || sheetId === 'YOUR_SHEET_ID') {
                    showError('⚠️ 請配置 Google Sheet ID 和 API Key');
                    return;
                }

                const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/面試追蹤?key=${apiKey}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.values) {
                    const headers = data.values[0];
                    allData = data.values.slice(1).map(row => {
                        const obj = {};
                        headers.forEach((header, index) => {
                            obj[header] = row[index] || '';
                        });
                        return obj;
                    });
                    displayTable(allData);
                    updateStats();
                }
            } catch (error) {
                console.error('讀取 Google Sheet 失敗：', error);
                showError('無法連接 Google Sheet，請檢查配置和網路連線');
            }
        }

        // 設置表單提交
        function setupFormSubmit() {
            document.getElementById('addForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData);

                try {
                    const response = await fetch(CONFIG.APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    if (result.success) {
                        showSuccess('✅ 記錄已新增！');
                        resetForm();
                        setTimeout(() => {
                            loadDataFromGoogleSheet();
                        }, 1000);
                    }
                } catch (error) {
                    console.error('提交失敗：', error);
                    showError('❌ 提交失敗，請檢查配置');
                }
            });

            document.getElementById('editForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                // 編輯功能需要更新 Google Sheet（可選）
                showSuccess('✅ 記錄已更新！');
                closeModal();
            });
        }

        // 顯示表格
        function displayTable(data) {
            const container = document.getElementById('tableContainer');
            if (data.length === 0) {
                container.innerHTML = '<div class="error">暫無記錄</div>';
                return;
            }

            const headers = Object.keys(data[0]);
            let html = '<table><thead><tr>';
            headers.forEach(header => {
                html += `<th>${header}</th>`;
            });
            html += '<th>操作</th></tr></thead><tbody>';

            data.forEach((row, index) => {
                html += '<tr>';
                headers.forEach(header => {
                    const value = row[header];
                    if (header === '目前狀態') {
                        const statusClass = `status-${value.toLowerCase()}`;
                        html += `<td><span class="status-badge ${statusClass}">${value}</span></td>`;
                    } else {
                        html += `<td>${value}</td>`;
                    }
                });
                html += `<td class="actions">
                    <button class="btn btn-edit" onclick="openEditModal(${index})">編輯</button>
                    <button class="btn btn-danger" onclick="deleteRow(${index})">刪除</button>
                </td></tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // 搜尋和篩選
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = allData.filter(row => {
                const matchSearch = !searchTerm ||
                    row.公司名稱?.toLowerCase().includes(searchTerm) ||
                    row.職位名稱?.toLowerCase().includes(searchTerm);
                const matchStatus = !statusFilter || row.目前狀態 === statusFilter;
                return matchSearch && matchStatus;
            });

            displayTable(filtered);
        }

        // 編輯模態框
        function openEditModal(index) {
            currentEditIndex = index;
            const record = allData[index];
            const form = document.getElementById('editForm');
            Object.entries(record).forEach(([key, value]) => {
                const input = form.elements[key];
                if (input) input.value = value;
            });
            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // 刪除行
        function deleteRow(index) {
            if (confirm('確認刪除此記錄？')) {
                allData.splice(index, 1);
                displayTable(allData);
                showSuccess('✅ 記錄已刪除！');
            }
        }

        // 下載 CSV
        function downloadCSV() {
            if (allData.length === 0) {
                alert('沒有資料可下載');
                return;
            }

            const headers = Object.keys(allData[0]);
            let csv = headers.join(',') + '\n';
            allData.forEach(row => {
                const values = headers.map(header => {
                    const value = row[header] || '';
                    return `"${value.toString().replace(/"/g, '""')}"`;
                });
                csv += values.join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `interview-tracking-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // 統計資訊
        function updateStats() {
            const container = document.getElementById('stats');
            const total = allData.length;
            const success = allData.filter(r => r.面試結果 === 'Pass').length;
            const successRate = total > 0 ? ((success / total) * 100).toFixed(1) : 0;

            container.innerHTML = `
                <div class="stat-card">
                    <h3>總投遞數</h3>
                    <div class="number">${total}</div>
                </div>
                <div class="stat-card">
                    <h3>成功錄取</h3>
                    <div class="number">${success}</div>
                </div>
                <div class="stat-card">
                    <h3>成功率</h3>
                    <div class="number">${successRate}%</div>
                </div>
                <div class="stat-card">
                    <h3>進行中</h3>
                    <div class="number">${allData.filter(r => r.目前狀態 === '面試中').length}</div>
                </div>
            `;
        }

        // 輔助函數
        function resetForm() {
            document.getElementById('addForm').reset();
        }

        function showSuccess(message) {
            const container = document.querySelector('#add .form-section');
            const msg = document.getElementById('formMessage');
            msg.innerHTML = `<div class="success">${message}</div>`;
            setTimeout(() => {
                msg.innerHTML = '';
            }, 3000);
        }

        function showError(message) {
            const msg = document.getElementById('formMessage') || document.createElement('div');
            msg.innerHTML = `<div class="error">${message}</div>`;
            if (!document.getElementById('formMessage')) {
                document.querySelector('.main-content').insertBefore(msg, document.querySelector('.tabs'));
                msg.id = 'formMessage';
            }
        }

        function getEnvironmentVariable(key) {
            // Vercel 環境變數通過 window 全局對象暴露（需要在 vercel.json 中配置）
            return window[`REACT_APP_${key}`] || '';
        }

        // 定時重新讀取數據（每 5 分鐘）
        setInterval(loadDataFromGoogleSheet, 300000);
    </script>
</body>
</html>
